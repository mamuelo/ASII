version: '3.8'

services:
  # Base de datos PostgreSQL para la API 2 (Spring Boot Calendario)
  postgres:
    image: postgres:15-alpine
    container_name: postgres-calendario
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-calendario_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_calendario_data:/var/lib/postgresql/data

volumes:
  postgres_calendario_data:
    driver: local
