version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-calendario
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-calendario_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_calendario_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calendario_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_calendario_data:
    driver: local
