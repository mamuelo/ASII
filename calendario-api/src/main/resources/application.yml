server:
  port: ${PORT:8080}

spring:
  application:
    name: calendario-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:calendario_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Configuración del cliente para la API externa de festivos (Express JS + MongoDB)
festivos:
  api:
    url: ${FESTIVOS_API_URL:http://localhost:3000}
    endpoint: ${FESTIVOS_API_ENDPOINT:/api/festivos/obtener/{anio}}
    connect-timeout-ms: 5000
    read-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    co.edu.itm.calendario: DEBUG
